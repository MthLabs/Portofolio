<style>
:root{--bg:#F4FAF0;--ink:#2D3A2E;--muted:#5E6B5C;--acc:#C5DDB8;--on:#2D3A2E;--font:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);min-height:100dvh}

a{display:inline-flex;align-items:center;height:48px;padding:0 1.15rem;border-radius:999px;background:var(--acc);color:var(--on);text-decoration:none;font-weight:500;margin-top:.8rem}

</head>

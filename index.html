<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#F4FAF0"/>
<title>Mathieu El Almawie</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F4FAF0; --s1:#EAF4E4; --s2:#E0EED6; --s3:#D4E8C8; --s4:#EAF4E4; --s5:#F4FAF0;
  --card:#FFFcf8; --ink:#2D3A2E; --muted:#5E6B5C; --acc:#C5DDB8; --on:#2D3A2E;
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:28px;
}
html{color-scheme:only light;}
html,body{margin:0;background:var(--bg) !important;color:var(--ink) !important;color-scheme:only light;}
*{box-sizing:border-box}
body{font-family:var(--font);line-height:1.5;min-height:100dvh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{width:min(1080px,calc(100% - 1.5rem));margin-inline:auto}
header.top{
  position:sticky;top:0;z-index:50;
  background:color-mix(in oklab, var(--bg) 86%, transparent);
  backdrop-filter:blur(16px);
}
.bar{display:flex;align-items:center;justify-content:space-between;gap:.8rem;min-height:64px}
.left{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
.brand-lock{display:flex;align-items:center;gap:.55rem;min-width:0}
.mea{width:36px;height:36px;flex-shrink:0;display:block}

.logo{font-weight:500;letter-spacing:-.03em;white-space:nowrap}
.themes{display:flex;gap:.35rem;align-items:center}
.sw{width:16px;height:16px;border-radius:99px;border:1px solid color-mix(in oklab, var(--ink) 25%, transparent);cursor:pointer;padding:0}
.sw[aria-current="true"]{outline:2px solid var(--ink);outline-offset:2px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:.2rem;min-width:0}
.nav{display:flex;gap:.1rem;overflow:auto;scrollbar-width:none;max-width:100%}
.langs{display:flex;gap:.15rem}
.nav a,.lang{color:var(--muted);font-size:.8rem;padding:.42rem .62rem;border-radius:999px;background:transparent;border:0;cursor:pointer;font:inherit}
.nav a:hover,.lang:hover{color:var(--ink)}
.nav a.on{background:var(--acc);color:var(--on)}
.lang.on{background:var(--acc);color:var(--on)}

.band{min-height:88vh;padding:4.2rem 0 5.5rem;background:var(--bg)}
#missions{background:var(--s1)}
#formation{background:var(--s2)}
#ia{background:var(--s3)}
#lab{background:var(--s4)}
#contact{background:var(--s5)}
.band h1,.band h2{font-weight:500;letter-spacing:-.04em}
h1{font-size:clamp(2.4rem,8vw,5.2rem);line-height:.98;max-width:13ch;margin:0 0 1.2rem}
h2{font-size:clamp(1.6rem,4vw,2.4rem);margin:0 0 .5rem}
.aubay{height:64px;width:auto;max-width:min(220px,70vw);display:block;object-fit:contain;margin:0 0 .6rem;object-position:left center}
.k{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:1rem}
.lede,.sub{max-width:34rem;color:var(--muted);margin-bottom:1.6rem}
.lede strong{color:var(--ink);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:.55rem}
.btn{display:inline-flex;align-items:center;height:48px;padding:0 1.15rem;border-radius:999px;font:inherit;font-weight:500;border:0;cursor:pointer}
.bp{background:var(--acc);color:var(--on)}
.bg{background:transparent;color:var(--ink);border:1px solid color-mix(in oklab,var(--ink) 18%, transparent)}
.block{background:var(--card);color:#2D3A2E;border-radius:var(--r);padding:1.3rem 1.35rem;margin-bottom:.8rem}
h3{font-size:1.12rem;font-weight:500;margin:0}
.meta{color:var(--muted);font-size:.84rem;margin:.25rem 0 .65rem}
.tools-row{display:flex;flex-wrap:wrap;gap:.45rem .7rem;margin:.55rem 0 .2rem}
.tool{display:inline-flex;align-items:center;gap:.35rem;font-size:.92rem}
.logo-i{width:18px;height:18px;object-fit:contain;vertical-align:-3px}
svg.euria{display:inline-block}
h3 .logo-i{width:22px;height:22px;margin-right:.35rem;vertical-align:-4px}
h3 img.brand{height:22px;width:auto;max-width:72px;object-fit:contain;vertical-align:-4px}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.75rem}
.chip{display:inline-block;font-size:.7rem;font-weight:500;padding:.22rem .6rem;border-radius:999px;border:1px solid #C5DDB8;background:#EAF4E4;color:#2D3A2E}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.75rem}
.quote{font-size:clamp(1.25rem,3vw,1.7rem);font-weight:500;letter-spacing:-.03em;line-height:1.25;max-width:22ch;margin:0 0 2rem}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .65s cubic-bezier(.22,1,.36,1),transform .65s cubic-bezier(.22,1,.36,1)}
.reveal.on{opacity:1;transform:none}
footer{background:var(--s5);color:var(--muted);padding:0 0 2rem;font-size:.84rem}
@media (max-width:820px){
  .bar{flex-wrap:wrap;align-items:center}
  .left{width:100%}
  .right{display:flex;width:100%;align-items:flex-start;order:3}
  .nav{width:100%;padding:.2rem 0 0}
  .band{min-height:82vh;padding:3rem 0 4.5rem}
}

@media (prefers-color-scheme: dark){
  html,body,.band,header.top,footer{background:#F4FAF0 !important;color:#2D3A2E !important;}
}
html,body,header.top,.band,footer{-webkit-tap-highlight-color:transparent;forced-color-adjust:none;}
.proof{display:flex;gap:.4rem;margin:1.2rem 0 0}
.proof i{flex:1;height:28px;border-radius:8px;border:1px solid #2D3A2E22}

</style>
</head>

function brandImg(name){
  const src=IMG[name] || (DOMAINS[name] ? "https://www.google.com/s2/favicons?domain="+DOMAINS[name]+"&sz=64" : "");
  if(!src) return "";
  return `<img class="logo-i brand" alt="" src="${src}" onerror="this.remove()"/>`;
}
function chips(s){return s?`<div class="chips">${s.split(",").map(x=>`<span class="chip">${x}</span>`).join("")}</div>`:""}
function card(title,meta,body,extra,ch){
  return `<article class="block"><h3>${title}</h3>${meta?`<p class="meta">${meta}</p>`:""}${body?`<p>${body}</p>`:""}${extra?`<p><strong>${extra}</strong></p>`:""}${chips(ch)}</article>`;
}
let lang=localStorage.getItem("lang")||"fr";
function paint(){
  const t=I[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{if(t[el.dataset.i]) el.innerHTML=t[el.dataset.i]});
  document.querySelectorAll(".lang").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
  document.getElementById("missions-list").innerHTML=missions[lang].map(x=>card(
  brandImg(x[0])+" "+x[0], x[1], x[2], x[3], x[4]
)).join("");
  document.getElementById("formation-list").innerHTML=edu[lang].map(x=>card(
  brandImg(x[0])+" "+x[0], x[1], x[2], "", x[3]||""
)).join("");
  document.getElementById("ia-list").innerHTML=ia[lang].map(x=>`<article class="block"><h3>${x[0]}</h3>${toolRow(x[1])}${chips(x[2])}</article>`).join("");
  document.getElementById("lab-list").innerHTML=lab[lang].map(x=>`<article class="block"><h3>${brandImg(x[0])} ${x[0]}</h3><p>${x[1]}</p>${toolRow(x[2])}</article>`).join("");
}
document.querySelectorAll(".lang").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem("lang",lang);paint()});
document.querySelectorAll(".sw").forEach(b=>b.onclick=()=>applyTheme(b.dataset.t));
let saved=localStorage.getItem("theme");
if(!T[saved]) saved="pistache";
applyTheme(saved);
paint();
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add("on")}),{threshold:.08});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));

const order=["top","missions","formation","ia","lab","contact"];
function setActive(id){
  document.querySelectorAll(".nav a").forEach(a=>{
    const href=(a.getAttribute("href")||"").replace("#","");
    a.classList.toggle("on", href===id || (id==="top" && href==="missions" && false));
  });
}
const spy=new IntersectionObserver(entries=>{
  const vis=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
  if(vis && vis.target && vis.target.id) setActive(vis.target.id);
},{root:null,rootMargin:"-20% 0px -55% 0px",threshold:[0,.15,.4,.7]});
order.forEach(id=>{const el=document.getElementById(id); if(el) spy.observe(el);});
window.addEventListener("scroll",()=>{
  const y=window.scrollY+90;
  let cur="top";
  order.forEach(id=>{const el=document.getElementById(id); if(el && el.offsetTop<=y) cur=id;});
  setActive(cur==="top"?"":cur);
},{passive:true});

</script>
